<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trippy — Loaders &amp; Destination Welcome</title>
<link rel="stylesheet" href="assets/colors_and_type.css">
<link rel="stylesheet" href="assets/jelly-glass.css">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); }
  #root { min-height: 100vh; }

  /* responsive showcase grid */
  .tl-grid {
    display: grid;
    grid-template-columns: minmax(360px, 420px) minmax(0, 1fr);
    gap: clamp(24px, 3.5vw, 52px);
    align-items: start;
  }
  .tl-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }
  @media (max-width: 940px) {
    .tl-grid { grid-template-columns: 1fr; justify-items: center; }
    .tl-grid > div:last-child { width: 100%; }
  }
  /* keep grain above page bg but below content */
  .grain { isolation: isolate; }
  button { font-family: inherit; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="flags.js"></script>
<script src="assets/trippy-icons.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="loaders.jsx"></script>
  <script type="text/babel" src="welcome.jsx"></script>
  <script type="text/babel" src="phone.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
