<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 32px; background:var(--bg); }
  .r { display:flex; align-items:baseline; gap:20px; padding:7px 0; border-bottom:1px solid var(--rule); }
  .r:last-child { border-bottom:none; }
  .lbl { font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; color:var(--text-3); width:120px; flex:none; }
  .spec { font-family:var(--font-serif); color:var(--text); line-height:1; white-space:nowrap; }
</style></head>
<body>
  <div class="r"><span class="lbl">2xl · 2.441rem</span><span class="spec" style="font-size:var(--text-2xl);">Always north</span></div>
  <div class="r"><span class="lbl">xl · 1.953rem</span><span class="spec" style="font-size:var(--text-xl);">Always north</span></div>
  <div class="r"><span class="lbl">lg · 1.563rem</span><span class="spec" style="font-size:var(--text-lg);">Always north</span></div>
  <div class="r"><span class="lbl">md · 1.25rem</span><span class="spec" style="font-family:var(--font-sans); font-weight:600; font-size:var(--text-md);">Always north</span></div>
  <div class="r"><span class="lbl">base · 1rem</span><span class="spec" style="font-family:var(--font-sans); font-size:var(--text-base);">Always north</span></div>
  <div class="r"><span class="lbl">sm · 0.8rem</span><span class="spec" style="font-family:var(--font-sans); font-size:var(--text-sm); color:var(--text-2);">Always north</span></div>
  <div class="r"><span class="lbl">xs · 0.64rem</span><span class="spec" style="font-family:var(--font-mono); font-size:var(--text-xs); letter-spacing:.12em; text-transform:uppercase; color:var(--text-3);">Always north</span></div>
</body></html>
