<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../assets/jelly-glass.css">
<script src="../assets/trippy-icons.js"></script>
<style>
  body { margin:0; padding:26px 32px; background:var(--bg); }
  h6 { margin:0 0 16px; font-family:var(--font-sans); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .gbtn { border:0; cursor:pointer; height:44px; padding:0 18px; border-radius:9999px; font-family:var(--font-sans);
    font-weight:600; font-size:14px; letter-spacing:-0.01em; display:inline-flex; align-items:center; gap:6px; }
  .g-default { background:rgba(255,255,255,0.72); color:var(--text); backdrop-filter:var(--blur-sm);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 8px oklch(13% 0.012 55 / 7%); }
  .g-flat { background:var(--glass-base); color:var(--text); backdrop-filter:var(--blur-sm);
    box-shadow:inset 0 0 0 1px oklch(13% 0.012 55 / 8%), inset 0 1px 0 rgba(255,255,255,0.4); }
  .g-accent { background:var(--brand); color:#fff; box-shadow:0 6px 20px oklch(42% 0.092 155 / 28%), inset 0 1px 0 rgba(255,255,255,0.15); }
  .g-coral { background:var(--terra); color:#fff; box-shadow:0 6px 20px oklch(62% 0.115 40 / 28%), inset 0 1px 0 rgba(255,255,255,0.15); }
  .fab { width:56px; height:56px; border-radius:50%; padding:0; justify-content:center; }
</style></head>
<body>
  <h6>Glass Buttons <span style="color:var(--text-3); font-weight:400;">— floating controls over content &amp; maps</span></h6>
  <div class="row">
    <button class="gbtn g-default" id="b1"></button>
    <button class="gbtn g-flat">Filters</button>
    <button class="gbtn g-accent" id="b2"></button>
    <button class="gbtn g-coral fab" id="b3"></button>
  </div>
  <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-3); margin-top:16px; letter-spacing:.03em;">backdrop-blur(20) saturate(1.6) · 44px min height · spring tap</div>
  <script>
    b1.innerHTML = TrippyIcon('share',{size:18}) + 'Share';
    b2.innerHTML = TrippyIcon('sparkle',{size:18,color:'#fff'}) + 'Ask Trippy';
    b3.innerHTML = TrippyIcon('plus',{size:24,color:'#fff'});
  </script>
</body></html>
