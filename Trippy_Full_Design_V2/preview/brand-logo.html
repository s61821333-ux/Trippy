<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:26px 32px; background:var(--bg); display:flex; align-items:center; gap:40px; }
  .lockup { display:flex; align-items:center; gap:14px; }
  .wm { font-size:40px; }
  .stack { display:flex; flex-direction:column; gap:24px; }
  .cap { font-family:var(--font-mono); font-size:10px; color:var(--text-3); letter-spacing:.08em; text-transform:uppercase; margin-top:6px; }
  .onforest { background:var(--brand); border-radius:var(--radius-lg); padding:18px 24px; }
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="lockup">
        <img src="../assets/compass-mark.svg" width="48" height="48" alt="">
        <span class="wm">Trippy<span class="dot">.</span></span>
      </div>
      <div class="cap">Primary horizontal lockup</div>
    </div>
    <div>
      <div class="lockup onforest">
        <img src="../assets/compass-mark.svg" width="40" height="40" alt="" style="filter:none;">
        <span class="wm" style="color:var(--text-inv); font-size:34px;">Trippy<span style="color:var(--sand-300);">.</span></span>
      </div>
      <div class="cap">Reversed · on forest</div>
    </div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
    <img src="../assets/compass-mark.svg" width="120" height="120" alt="Trippy compass mark">
    <div class="cap" style="text-align:center;">The mark · 4-point rose<br>240-unit canvas</div>
  </div>
</body></html>
