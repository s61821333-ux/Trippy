<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:26px 32px; background:var(--bg); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .cell { border-radius:var(--radius-md); padding:14px 16px; display:flex; flex-direction:column; gap:5px; }
  .dot { width:18px; height:18px; border-radius:50%; }
  .lab { font-family:var(--font-sans); font-weight:600; font-size:14px; }
  .v { font-family:var(--font-mono); font-size:11px; opacity:.75; }
  h6 { margin:0 0 14px; font-family:var(--font-sans); }
</style></head>
<body>
  <h6>Semantic Colors</h6>
  <div class="grid">
    <div class="cell" style="background:var(--success-bg);"><div class="dot" style="background:var(--success);"></div><span class="lab" style="color:var(--success);">Success</span><span class="v" style="color:var(--success);">Trip locked in</span></div>
    <div class="cell" style="background:var(--warning-bg);"><div class="dot" style="background:var(--warning);"></div><span class="lab" style="color:var(--warning);">Warning</span><span class="v" style="color:var(--warning);">2 gaps to fill</span></div>
    <div class="cell" style="background:var(--danger-bg);"><div class="dot" style="background:var(--danger);"></div><span class="lab" style="color:var(--danger);">Danger</span><span class="v" style="color:var(--danger);">Couldn’t save</span></div>
  </div>
  <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-3); margin-top:14px; letter-spacing:.03em;">Each pairs a saturated text/icon hue with a soft tinted background. Success reuses the forest hue (155°).</div>
</body></html>
