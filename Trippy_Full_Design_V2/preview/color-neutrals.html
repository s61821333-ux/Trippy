<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:26px 32px; background:var(--bg); }
  .scale { display:flex; gap:8px; }
  .sw { flex:1; height:72px; border-radius:var(--radius-sm); display:flex; align-items:flex-end; padding:8px; border:1px solid var(--rule); }
  .n { font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; color:var(--text-2); }
  h6 { margin:0 0 14px; font-family:var(--font-sans); }
  .cap { font-family:var(--font-mono); font-size:11px; color:var(--text-3); margin-top:12px; letter-spacing:.03em; }
</style></head>
<body>
  <h6>Warm Paper Neutrals <span style="color:var(--text-3); font-weight:400;">— earthy, warm, worn-in</span></h6>
  <div class="scale">
    <div class="sw" style="background:var(--paper-hi);"><span class="n">paper-hi</span></div>
    <div class="sw" style="background:var(--bg);"><span class="n">bg</span></div>
    <div class="sw" style="background:var(--bg-warm);"><span class="n">bg-warm</span></div>
    <div class="sw" style="background:var(--bg-alt);"><span class="n">bg-alt</span></div>
    <div class="sw" style="background:var(--surface);"><span class="n">surface</span></div>
  </div>
  <div class="cap">oklch(98% 0.010 75) → oklch(92% 0.016 75) · subtle warm hue (75°) carried through every neutral</div>
  <div class="scale" style="margin-top:18px;">
    <div class="sw" style="background:var(--text);"><span class="n" style="color:#fff;">ink</span></div>
    <div class="sw" style="background:var(--text-2);"><span class="n" style="color:#fff;">text-2</span></div>
    <div class="sw" style="background:var(--text-3);"><span class="n" style="color:#fff;">text-3</span></div>
    <div class="sw" style="background:var(--border);"><span class="n">border</span></div>
    <div class="sw" style="background:var(--border-strong);"><span class="n">border-str</span></div>
  </div>
</body></html>
