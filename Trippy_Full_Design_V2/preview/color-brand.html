<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:26px 32px; background:var(--bg); }
  .scale { display:flex; gap:8px; }
  .sw { flex:1; height:74px; border-radius:var(--radius-sm); display:flex; align-items:flex-end; padding:8px; box-shadow:var(--shadow-xs); }
  .n { font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; }
  h6 { margin:0 0 14px; font-family:var(--font-sans); }
  .cap { font-family:var(--font-mono); font-size:11px; color:var(--text-3); margin-top:12px; letter-spacing:.03em; }
</style></head>
<body>
  <h6>Brand · Forest Green <span style="color:var(--text-3); font-weight:400;">— primary, leads on dense screens &amp; headlines</span></h6>
  <div class="scale">
    <div class="sw" style="background:var(--brand-100);"><span class="n" style="color:var(--brand-700);">100</span></div>
    <div class="sw" style="background:var(--brand-300);"><span class="n" style="color:var(--brand-800);">300</span></div>
    <div class="sw" style="background:var(--brand-500);"><span class="n" style="color:#fff;">500</span></div>
    <div class="sw" style="background:var(--brand-600); outline:2px solid var(--text); outline-offset:2px;"><span class="n" style="color:#fff;">600 ·brand</span></div>
    <div class="sw" style="background:var(--brand-700);"><span class="n" style="color:#fff;">700</span></div>
    <div class="sw" style="background:var(--brand-900);"><span class="n" style="color:#fff;">900</span></div>
  </div>
  <div class="cap">oklch(42% 0.092 155) · forest #3B6E52 family</div>
</body></html>
