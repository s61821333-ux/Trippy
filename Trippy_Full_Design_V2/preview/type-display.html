<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 32px; background:var(--bg); }
  .row { display:flex; align-items:baseline; gap:18px; }
  .tag { font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; color:var(--text-3); text-transform:uppercase; width:88px; flex:none; }
</style></head>
<body>
  <div style="display:flex; flex-direction:column; gap:14px;">
    <div class="row"><span class="tag">Display</span><span style="font-family:var(--font-serif); font-size:46px; line-height:1; letter-spacing:-0.02em;">Plan trips with friends</span></div>
    <div class="row"><span class="tag">Italic</span><span class="hero-title" style="font-size:40px; color:var(--terra);">Together, the easy way.</span></div>
    <div class="row" style="align-items:center;"><span class="tag">Specimen</span><span style="font-family:var(--font-serif); font-size:30px; color:var(--text-2);">AaBbCcDd 0123 &amp; — “editorial”</span></div>
    <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-3); letter-spacing:.04em; margin-top:2px;">Instrument Serif · 400 · used italic for editorial moments, taglines &amp; quoted user voices</div>
  </div>
</body></html>
