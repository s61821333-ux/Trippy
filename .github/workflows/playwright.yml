name: Playwright UI Tests

on:
  push:
    branches: [main]

jobs:
  # ── Step 1: count how many files changed in this push ───────────────────────
  count-changes:
    runs-on: ubuntu-latest
    outputs:
      large_push: ${{ steps.count.outputs.large_push }}
      file_count: ${{ steps.count.outputs.file_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count changed files
        id: count
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # On first-ever push, before is all zeros
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            COUNT=$(git diff-tree --no-commit-id -r --name-only "$AFTER" | wc -l)
          else
            COUNT=$(git diff --name-only "$BEFORE" "$AFTER" | wc -l)
          fi

          echo "file_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "large_push=$([ "$COUNT" -gt 50 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          echo "ℹ️ Changed files: $COUNT (threshold: 50)"

  # ── Step 2: run Playwright only when > 50 files changed ─────────────────────
  playwright:
    needs: count-changes
    if: needs.count-changes.outputs.large_push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only install Chromium in CI — keeps the job fast
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (Desktop Chrome only)
        run: npx playwright test --project="Desktop Chrome"
        env:
          # ── Supabase (required for server to start + API health checks) ──
          NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:           ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ── Optional: needed for weather/places/AI tests to fully pass ──
          GOOGLE_MAPS_API_KEY:         ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          APP_URL:                     http://localhost:3000

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Post summary
        if: always()
        run: |
          echo "## Playwright results" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by **${{ needs.count-changes.outputs.file_count }} changed files**" >> "$GITHUB_STEP_SUMMARY"
