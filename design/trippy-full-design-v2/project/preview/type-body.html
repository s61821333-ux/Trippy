<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 32px; background:var(--bg); }
  .row { display:flex; align-items:baseline; gap:18px; margin-bottom:12px; }
  .tag { font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; color:var(--text-3); text-transform:uppercase; width:120px; flex:none; }
</style></head>
<body>
  <div class="row"><span class="tag">Bold · 700</span><span style="font-family:var(--font-sans); font-weight:700; font-size:26px; letter-spacing:-0.02em;">A thoughtful friend</span></div>
  <div class="row"><span class="tag">Semibold · 600</span><span style="font-family:var(--font-sans); font-weight:600; font-size:22px;">Lisbon, slowly</span></div>
  <div class="row"><span class="tag">Medium · 500</span><span style="font-family:var(--font-sans); font-weight:500; font-size:18px; color:var(--text-2);">Confirmed · Oct 12 → 18</span></div>
  <div class="row" style="align-items:flex-start;"><span class="tag">Regular · 400</span><span style="font-family:var(--font-sans); font-weight:400; font-size:15px; color:var(--text-2); line-height:1.5; max-width:430px;">Add a few friends and tell us roughly where you’re heading. We’ll handle the hour-by-hour from there.</span></div>
  <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-3); letter-spacing:.04em; margin-top:6px;">DM Sans Variable · geometric body voice · -0.01 to -0.02em tracking</div>
</body></html>
