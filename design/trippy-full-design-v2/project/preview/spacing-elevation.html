<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:30px 32px; background:var(--bg); }
  .row { display:flex; gap:26px; align-items:center; }
  .box { width:84px; height:84px; border-radius:var(--radius-lg); background:var(--paper-hi); }
  .lab { font-family:var(--font-mono); font-size:10px; color:var(--text-3); margin-top:12px; text-align:center; letter-spacing:.04em; }
  h6 { margin:0 0 22px; font-family:var(--font-sans); }
  .col { display:flex; flex-direction:column; align-items:center; }
</style></head>
<body>
  <h6>Elevation <span style="color:var(--text-3); font-weight:400;">— layered, warm-ink oklch shadows (never pure black)</span></h6>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xs);"></div><span class="lab">xs</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-sm);"></div><span class="lab">sm</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-md);"></div><span class="lab">md</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg);"></div><span class="lab">lg</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xl);"></div><span class="lab">xl</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-brand-glow); background:var(--brand);"></div><span class="lab" style="color:var(--brand);">brand glow</span></div>
  </div>
</body></html>
