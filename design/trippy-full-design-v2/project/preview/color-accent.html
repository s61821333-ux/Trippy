<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:26px 32px; background:var(--bg); }
  .scale { display:flex; gap:8px; }
  .sw { flex:1; height:74px; border-radius:var(--radius-sm); display:flex; align-items:flex-end; padding:8px; box-shadow:var(--shadow-xs); }
  .n { font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; }
  h6 { margin:0 0 14px; font-family:var(--font-sans); }
  .cap { font-family:var(--font-mono); font-size:11px; color:var(--text-3); margin-top:12px; letter-spacing:.03em; }
</style></head>
<body>
  <h6>Accent · Terracotta <span style="color:var(--text-3); font-weight:400;">— reserved for CTAs &amp; high-intent moments</span></h6>
  <div class="scale">
    <div class="sw" style="background:var(--terra-100);"><span class="n" style="color:var(--terra-700);">100</span></div>
    <div class="sw" style="background:var(--terra-300);"><span class="n" style="color:var(--terra-700);">300</span></div>
    <div class="sw" style="background:var(--terra-500); outline:2px solid var(--text); outline-offset:2px;"><span class="n" style="color:#fff;">500 ·terra</span></div>
    <div class="sw" style="background:var(--terra-600);"><span class="n" style="color:#fff;">600 ·hover</span></div>
    <div class="sw" style="background:var(--terra-700);"><span class="n" style="color:#fff;">700</span></div>
  </div>
  <h6 style="margin-top:20px;">Secondary · Sand Gold <span style="color:var(--text-3); font-weight:400;">— a highlight, never alone</span></h6>
  <div class="scale">
    <div class="sw" style="background:var(--sand-light);"><span class="n" style="color:var(--sand-600);">light</span></div>
    <div class="sw" style="background:var(--sand-300);"><span class="n" style="color:var(--text);">300</span></div>
    <div class="sw" style="background:var(--sand-500); outline:2px solid var(--text); outline-offset:2px;"><span class="n" style="color:#fff;">500 ·sand</span></div>
    <div class="sw" style="background:var(--sand-600);"><span class="n" style="color:#fff;">600</span></div>
  </div>
</body></html>
