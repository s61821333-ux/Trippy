<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trippy — App UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../assets/jelly-glass.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(circle at 22% 18%, oklch(92% 0.048 75) 0%, transparent 42%),
      radial-gradient(circle at 82% 82%, oklch(94% 0.032 155) 0%, transparent 46%),
      var(--bg-alt);
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 28px;
  }
  #root { display: flex; align-items: center; justify-content: center; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  /* Resilient entrances — transform-only so content is never invisible if a
     capture context freezes CSS animations at frame 0. Overrides jelly-glass.css. */
  @keyframes fadeIn { from { transform: none; } to { transform: none; } }
  @keyframes blurFadeUp { from { transform: translateY(12px); } to { transform: none; } }
  @keyframes popIn { 0% { transform: scale(0.92); } 100% { transform: none; } }
  .an-fade { animation: fadeIn 0.28s ease forwards; }
  /* ── Tweak-driven interaction layer ── */
  @keyframes txSlideR { from { transform: translateX(46px); } to { transform: none; } }
  @keyframes txSlideL { from { transform: translateX(-46px); } to { transform: none; } }
  @keyframes txFade   { from { opacity: .3; } to { opacity: 1; } }
  @keyframes txZoom   { from { transform: scale(0.93); } to { transform: none; } }
  .tx-slideR { animation: txSlideR var(--tw-dur, .42s) var(--tw-ease, cubic-bezier(.34,1.56,.64,1)) both; }
  .tx-slideL { animation: txSlideL var(--tw-dur, .42s) var(--tw-ease, cubic-bezier(.34,1.56,.64,1)) both; }
  .tx-fade   { animation: txFade   var(--tw-dur, .42s) ease both; }
  .tx-zoom   { animation: txZoom   var(--tw-dur, .42s) var(--tw-ease, cubic-bezier(.34,1.56,.64,1)) both; }
  @keyframes spin360 { to { transform: rotate(360deg); } }
  @keyframes haloPulse { 0%,100% { transform: scale(.86); opacity: .7; } 50% { transform: scale(1.05); opacity: 1; } }
  @keyframes entryPop { 0% { transform: scale(.6); opacity: 0; filter: blur(8px); } 55% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; filter: blur(0); } }
  .hoverlift { transition: transform .3s var(--tw-ease, cubic-bezier(.34,1.56,.64,1)), box-shadow .3s ease; }
  .lift-on .hoverlift:hover { transform: translateY(-4px) scale(1.012); box-shadow: 0 20px 46px oklch(13% 0.012 55 / 16%); }
  .lift-on .press:active { transform: scale(.97); }
  /* hide scrollbars inside phone for clean capture */
  #root ::-webkit-scrollbar { width: 0; height: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/trippy-icons.js"></script>
<script src="../../assets/trippy-stamps.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="welcome.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
